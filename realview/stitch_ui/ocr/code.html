<style>
        .viewfinder-corner {
            width: 40px;
            height: 40px;
            border-color: #ffb2b7; /* inverse-primary */
            border-style: solid;
            position: absolute;
        }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }
        
        .scanning-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #dc2c4f; /* primary-container */
            box-shadow: 0 0 10px #dc2c4f;
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
